spring:
  application:
    name: sobun-sobun

  datasource:
    url: jdbc:postgresql://localhost:5432/sobunsobun
    username: sobunsobun
    password: sobunsobun
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 해커톤 기간 한정. 운영 전환 시 validate/none + 마이그레이션 도구로 교체
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 영수증 업로드(③ 정산). 기본값 1MB는 휴대폰 사진에 너무 작다.
  # 앱 검증 한도(10MB, SettlementService)보다 여유 있게 둬서 10MB 초과는 우리 쪽 400 메시지로 거절되게 한다.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

# 팟 실시간 정산 갱신(WebSocket) 엔드포인트는 global/config/WebSocketConfig 참고

naver:
  ocr:
    invoke-url: ${NAVER_OCR_INVOKE_URL:}
    secret-key: ${NAVER_OCR_SECRET_KEY:}
  shopping:
    client-id: ${NAVER_SHOPPING_CLIENT_ID:}
    client-secret: ${NAVER_SHOPPING_CLIENT_SECRET:}

# 주소+GPS 건물 인증 온보딩(① 지원). 키가 없으면 각 Config가 Stub 구현체를 자동 선택한다.
juso:
  api-key: ${JUSO_API_KEY:}
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
location-check:
  # true면 GPS 2차 확인 시 요청 좌표 대신 고정 데모 좌표를 쓴다. 기본 꺼짐 — 운영/기본 환경에서는 항상 꺼져 있어야 한다.
  demo-mode: ${LOCATION_CHECK_DEMO_MODE:false}

# 실제 값은 커밋하지 말고 application-local.yml(gitignore 처리됨)에서 덮어써주세요.
# 발급 방법: ../../../../../docs/API_KEYS.md
