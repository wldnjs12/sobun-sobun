# 로컬 개발용 PostgreSQL (brew로 직접 설치하는 대신 Docker로 띄우는 방법, docs/SETUP.md 1번 참고)
# 계정·DB 이름은 backend/src/main/resources/application.yml 기본값과 같아서 백엔드 설정을 바꿀 필요가 없다.
#   켜기: docker compose up -d     끄기: docker compose down     데이터까지 지우기: docker compose down -v
# 로컬 전용 값이라 비밀번호를 그대로 적어둔다 (배포 DB는 Railway 환경변수로 따로 설정 — docs/DEPLOY.md).
services:
  postgres:
    image: postgres:16-alpine # 가벼운 버전 (일반 postgres:16 이미지는 다운로드가 크다)
    container_name: sobunsobun-postgres
    environment:
      POSTGRES_USER: sobunsobun
      POSTGRES_PASSWORD: sobunsobun
      POSTGRES_DB: sobunsobun
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432" # 내 컴퓨터에서만 접속 가능 (같은 와이파이의 다른 기기에 DB를 열지 않음)
    volumes:
      - sobunsobun-db:/var/lib/postgresql/data # 컨테이너를 꺼도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobunsobun -d sobunsobun"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sobunsobun-db:
